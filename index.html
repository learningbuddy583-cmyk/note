<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HKDSE ICT｜互動筆記庫</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --text:#2c2c2a; --muted:#5f5e5a; --line:#e3e4e8;
  --blue:#185fa5; --blue-bg:#e6f1fb;
  --teal:#0f6e56; --teal-bg:#e1f5ee;
  --purple:#534ab7; --purple-bg:#eeedfe;
  --amber:#854f0b; --amber-bg:#faeeda;
  --red:#a32d2d; --green:#3b6d11; --green-bg:#eaf3de;
  --sidebar-w:280px;
  --sidebar-w-closed:0px;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;overflow:hidden}

/* ===== 頂欄 ===== */
.topbar{height:56px;background:linear-gradient(135deg,#185fa5,#0f6e56);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;position:relative;z-index:30;flex:none}
.topbar .brand{font-size:16px;font-weight:600;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .brand small{display:block;font-size:11px;font-weight:400;opacity:.85;margin-top:1px}
.toggle-btn{flex:none;width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:16px;cursor:pointer;transition:background .15s;display:inline-flex;align-items:center;justify-content:center}
.toggle-btn:hover{background:rgba(255,255,255,.3)}
.spacer{flex:1}
.lang-switch{display:flex;gap:4px}
.lang-btn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.45);padding:4px 12px;border-radius:999px;font-size:12px;cursor:pointer;font-weight:600;transition:all .15s}
.lang-btn:hover{background:rgba(255,255,255,.28)}
.lang-btn.active{background:#fff;color:#185fa5}

/* ===== 主體：左側覽/右內容 ===== */
.layout{display:flex;height:calc(100% - 56px);flex:1}

/* 左側導覽 */
.sidebar{width:var(--sidebar-w);background:#fff;border-right:1px solid var(--line);overflow-y:auto;transition:width .22s ease;flex:none}
body.sidebar-closed .sidebar{width:var(--sidebar-w-closed);border-right:none;overflow:hidden}
.sidebar-inner{padding:14px;min-width:var(--sidebar-w)}
.side-sub{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;padding:6px 10px 8px}

/* 冊（書本） */
.book{margin-bottom:8px}
.book-head{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--radius);cursor:pointer;user-select:none;transition:background .13s;color:var(--text)}
.book-head:hover{background:var(--blue-bg)}
.book-head .chev{width:16px;height:16px;flex:none;transition:transform .18s ease;color:var(--muted);font-size:11px}
.book.open > .book-head .chev{transform:rotate(90deg)}
.book-head .t{font-weight:600;font-size:14px;flex:1;line-height:1.3}
.book-head .d{display:block;font-size:11px;color:var(--muted);font-weight:400}
.book-head .cnt{font-size:11px;color:var(--blue);background:var(--blue-bg);border-radius:999px;padding:1px 8px;font-weight:600}
.book-head .cnt.none{color:var(--muted);background:#f0f1f3}
.book-body{display:none;padding:2px 0 4px 16px;border-left:2px solid var(--line);margin-left:15px}
.book.open > .book-body{display:block}

/* 章節條目 */
.unit-item{display:block;padding:9px 11px;margin:2px 0;border-radius:9px;color:var(--text);text-decoration:none;cursor:pointer;font-size:13.5px;transition:background .13s,border-color .13s;border-left:3px solid transparent;}
.unit-item:hover{background:var(--blue-bg)}
.unit-item .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:1px}
.unit-item .u-t{font-weight:600}
.unit-item .u-en{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-left:17px}
.unit-item.active{background:var(--blue-bg);border-left-color:var(--blue);color:var(--blue)}
.unit-item.active .u-en{color:var(--blue)}
.unit-item.disabled{color:var(--muted);opacity:.55;cursor:default;pointer-events:none}

.empty-book{font-size:12px;color:var(--muted);padding:2px 4px 6px 4px}

/* ===== 右側內容 ===== */
.content{flex:1;position:relative;overflow:hidden;background:var(--bg)}
.content iframe{width:100%;height:100%;border:none;display:none}
.content.show-frame iframe{display:block}
.welcome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:24px}
.welcome.hidden{display:none}
.welcome .ic{font-size:46px;margin-bottom:16px}
.welcome h2{font-size:20px;color:var(--text);margin-bottom:8px}
.welcome p{font-size:14px;max-width:420px}

@media(max-width:640px){
  :root{--sidebar-w:236px}
  .topbar .brand small{display:none}
}
</style>
</head>
<body data-lang="zh">
<div class="topbar">
  <button class="toggle-btn" id="toggleBtn" aria-label="Toggle sidebar">☰</button>
  <div class="brand">
    HKDSE ICT 互動筆記庫
    <small data-zh="選擇書本與章節在右側開啟" data-en="Pick a chapter to open in the content panel">選擇書本與章節在右側開啟</small>
  </div>
  <div class="spacer"></div>
  <div class="lang-switch">
    <button class="lang-btn active" data-lang="zh">中文</button>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-inner" id="sidebarInner"></div>
  </aside>

  <main class="content" id="content">
    <div class="welcome" id="welcome">
      <span class="ic">📚</span>
      <h2 data-zh="請選擇一個章節" data-en="Select a chapter">請選擇一個章節</h2>
      <p data-zh="從左側導覽選擇書籍冊別並點擊章節，內容會在右側開啟。" data-en="Choose a book from the sidebar and click a chapter to open it here.">從左側導覽選擇書籍冊別並點擊章節，內容會在右側開啟。</p>
    </div>
    <iframe id="frame" title="chapter"></iframe>
  </main>
</div>

<script>
// ============ 書本與單元配置，新增單元只修改這裡 ============
const unitDot = { blue:'#185fa5', teal:'#0f6e56', purple:'#534ab7', amber:'#854f0b', green:'#3b6d11' };
const bookData = [
  {
    id:"bookA", zh:"必修冊 A", en:"Core Module A",
    descZh:"資訊處理", descEn:"Information Processing", col:"blue",
    units:[
      {
        zh:"Ch1 資訊處理簡介",
        en:"Ch1 Introduction to Information Processing",
        path:"bookA/ch1.html", num:"Ch1",
        zhDesc:"資訊系統、數據與資訊、多媒體數碼化、資訊處理、資訊時代、資訊素養",
        enDesc:"Information system, data & information, multimedia digitisation, processing, information age, literacy"
      },
      {
        zh:"Ch2 數據控制及數據控制",
        en:"Ch2 Data Organisation and Data Control",
        path:"bookA/ch2.html", num:"Ch2",
        zhDesc:"",
        enDesc:""
      }
    ]
  },
  {id:"bookB", zh:"必修冊 B", en:"Core Module B", descZh:"", descEn:"", col:"teal", units:[]},
  {id:"bookC", zh:"必修冊 C", en:"Core Module C", descZh:"", descEn:"", col:"purple", units:[]},
  {id:"bookD", zh:"必修冊 D", en:"Core Module D", descZh:"", descEn:"", col:"amber", units:[]},
  {id:"bookE", zh:"必修冊 E", en:"Core Module E", descZh:"", descEn:"", col:"green", units:[]},
  {id:"electA", zh:"選修冊 A", en:"Elective Module A", descZh:"", descEn:"", col:"teal", units:[]},
  {id:"electC", zh:"選修冊 C", en:"Elective Module C", descZh:"", descEn:"", col:"purple", units:[]},
];

// ============ i18n ============
let LANG = 'zh';
function t(zh,en){ return LANG==='en'?en:zh; }

// ============ 渲染側欄 ============
const sidebarEl = document.getElementById("sidebarInner");
const contentEl = document.getElementById("content");
const frame = document.getElementById("frame");
const welcome = document.getElementById("welcome");
let active = null;

function renderSidebar(){
  sidebarEl.innerHTML = '<div class="side-sub" data-zh="書籍與章節" data-en="Books &amp; Chapters">書籍與章節</div>';

  bookData.forEach(book=>{
    const has = book.units.length>0;
    const bok = document.createElement("div");
    bok.className = "book"+(has?" open":"");
    const color = unitDot[book.col]||unitDot.blue;
    const cnts = has ? book.units.length + (LANG==='en'?' unit(s)':' 單元') : (LANG==='en'?'Soon':'即將推出');

    const head = document.createElement("div");
    head.className = "book-head";
    head.innerHTML =
      '<span class="chev">▶</span>'+
      '<span class="t">'+ (LANG==='en'?book.en:book.zh) +
        '<span class="d">'+(LANG==='en'?book.descEn:book.descZh)+'</span></span>'+
      '<span class="cnt'+(has?'':' none')+'">'+cnts+'</span>';
    head.addEventListener("click", ()=>{ if(has) bok.classList.toggle("open"); });
    bok.appendChild(head);

    const body = document.createElement("div");
    body.className = "book-body";
    if(has){
      book.units.forEach(u=>{
        const it = document.createElement("a");
        it.className = "unit-item";
        it.href = "#";
        it.style.color = color;
        it.dataset.book = book.id;
        it.dataset.i = book.units.indexOf(u);
        it.title = t(u.zhDesc,u.enDesc);
        it.innerHTML =
          '<span class="dot" style="background:'+color+'"></span>'+
          '<span class="u-t">'+u.num+' '+(LANG==='en'?u.en:u.zh)+'</span>'+
          '<span class="u-en">'+(LANG==='en'?u.zh:u.en)+'</span>';
        // 由 CSS 統一覆蓋 active / hover 色，這裡只存 data
        it.onclick = (e)=>{ e.preventDefault(); openChapter(book, u, it); };
        body.appendChild(it);
      });
    } else {
      const em = document.createElement("div");
      em.className = "empty-book";
      em.textContent = LANG==='en' ? "No notes yet." : "尚未建立單元筆記。";
      body.appendChild(em);
    }
    bok.appendChild(body);
    sidebarEl.appendChild(bok);
  });
}

function openChapter(book, unit, el){
  document.querySelectorAll(".unit-item").forEach(x=>x.classList.remove("active"));
  el.classList.add("active");
  active = unit.path;
  frame.src = unit.path;
  contentEl.classList.add("show-frame");
  welcome.classList.add("hidden");
}

// ============ 事件 ============
document.getElementById("toggleBtn").addEventListener("click", ()=>{
  document.body.classList.toggle("sidebar-closed");
});

document.querySelectorAll(".lang-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    LANG = btn.dataset.lang;
    document.body.dataset.lang = LANG;
    document.documentElement.lang = LANG==='en'?'en':'zh-Hant';
    document.querySelectorAll(".lang-btn").forEach(b=>b.classList.toggle("active",b.dataset.lang===LANG));
    document.querySelectorAll("[data-zh][data-en]").forEach(el=>{ el.innerHTML = t(el.dataset.zh, el.dataset.en); });
    renderSidebar();
  });
});

renderSidebar();

// 初始載入第一冊第一個單元（有內容才載）
const firstBook = bookData.find(b=>b.units.length);
if(firstBook){
  const u = firstBook.units[0];
  const target = document.querySelector('.unit-item[data-book="'+firstBook.id+'"]');
  openChapter(firstBook, u, target);
}
</script>
</body>
</html>
